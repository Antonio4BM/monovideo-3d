services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  monovideo3d:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./data:/monovideo/data
    working_dir: /monovideo
    ports:
      - 8000:8000
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JOB_TIMEOUT: "3300"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - ./data:/monovideo/data
    working_dir: /monovideo
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JOB_TIMEOUT: "3300"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
