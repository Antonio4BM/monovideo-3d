<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonoVideo3D Reconstructions</title>
  <link rel="stylesheet" href="./reconstructions.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="Primary">
      <a href="/">Upload</a>
      <a href="/reconstructions" aria-current="page">Reconstructions</a>
    </nav>
    <h1>Finished reconstructions</h1>
    <p class="hint" id="table-help">Published job metadata. Scroll horizontally for all columns and model actions.</p>
    <p id="catalog-status" role="status" aria-live="polite">Loading reconstruction metadata…</p>
    <p id="catalog-notice" role="status" aria-live="polite"></p>
    <div id="table-region" class="table-region" role="region" aria-label="Reconstruction metadata" aria-describedby="table-help" aria-busy="true" tabindex="0">
      <table id="reconstruction-table" aria-label="Published reconstructions"></table>
    </div>
  </main>

  <dialog id="model-dialog" aria-labelledby="model-title" aria-describedby="model-status">
    <header class="modal-header">
      <h2 id="model-title">3D reconstruction</h2>
      <button id="close-model" type="button" autofocus>Close</button>
    </header>
    <p id="model-status" role="status" aria-live="polite"></p>
    <div class="viewer-container"></div>
    <template>
      <model-viewer
        id="model-viewer"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        interaction-prompt="none"
        touch-action="pan-y"
        shadow-intensity="1"
        min-camera-orbit="auto auto 2%"
        alt="Reconstructed 3D model"
        orientation="180deg 30deg 40deg"
      ></model-viewer>
    </template>
  </dialog>

  <script type="module" src="./reconstructions.js"></script>
</body>
</html>
